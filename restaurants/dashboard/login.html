<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Restaurant sign in — PalTable</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <a href="/"><img src="/assets/logo_transparent.png" alt="PalTable"></a>
      <h1>Restaurant portal</h1>
      <p class="sub">Manage events, menus, and guest lists for your PalTable dinners.</p>
      <form action="index.html" method="get">
        <div class="field">
          <label for="email">Work email</label>
          <input id="email" type="email" value="manager@northbeachkitchen.com" readonly>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" value="••••••••" readonly>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign in to dashboard</button>
      </form>
      <p class="demo-note">Static preview only — no data is saved. Full restaurant tools are in the PalTable iOS app today.</p>
      <p style="margin:16px 0 0;font-size:0.85rem;color:#8a8a8a;text-align:center;">
        <a href="/restaurants/" style="color:#ff7f50;">Restaurant partner program</a>
      </p>
    </div>
  </div>
</body>
</html>
