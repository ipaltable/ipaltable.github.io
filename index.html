<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PalTable</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #f9f7f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .hero-media {
      position: absolute;
      inset: 0;
      background: #f9f7f5;
    }

    .hero-media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
    }

    .hero-logo {
      position: absolute;
      top: clamp(20px, 4vw, 36px);
      left: max(20px, calc((100vw - min(1120px, 100vw - 40px)) / 2));
      z-index: 2;
    }

    .hero-logo img {
      display: block;
      height: clamp(44px, 7vw, 64px);
      width: auto;
    }

    .site-footer {
      position: absolute;
      inset: auto 0 0 0;
      z-index: 2;
      padding: 20px max(20px, calc((100vw - min(1120px, 100vw - 40px)) / 2));
      background: linear-gradient(180deg, rgba(249, 247, 245, 0) 0%, rgba(249, 247, 245, 0.92) 45%);
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: #1a1a1a;
    }

    .footer-links a:hover {
      color: #e8713c;
    }

    .footer-meta {
      margin: 0;
      font-size: 0.82rem;
      color: #5c5c5c;
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="PalTable">
    <div class="hero-media" aria-hidden="true">
      <video autoplay muted loop playsinline>
        <source src="assets/hero1.mp4" type="video/mp4">
      </video>
    </div>
    <a class="hero-logo" href="/" aria-label="PalTable home">
      <img src="assets/logo_transparent.png" alt="PalTable">
    </a>
    <footer class="site-footer">
      <nav class="footer-links" aria-label="Legal">
        <a href="/privacy">Privacy Policy</a>
        <a href="/terms">Terms of Service</a>
        <a href="/eula">EULA</a>
      </nav>
      <p class="footer-meta">© 2026 PalTable, LLC. All rights reserved.</p>
    </footer>
  </section>
</body>
</html>
