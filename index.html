<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PalTable</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #f9f7f5;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .hero-media {
      position: absolute;
      inset: 0;
      background: #f9f7f5;
    }

    .hero-media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
    }

    .hero-logo {
      position: absolute;
      top: clamp(20px, 4vw, 36px);
      left: max(20px, calc((100vw - min(1120px, 100vw - 40px)) / 2));
      z-index: 2;
    }

    .hero-logo img {
      display: block;
      height: clamp(44px, 7vw, 64px);
      width: auto;
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="PalTable">
    <div class="hero-media" aria-hidden="true">
      <video autoplay muted loop playsinline>
        <source src="assets/hero1.mp4" type="video/mp4">
      </video>
    </div>
    <a class="hero-logo" href="/" aria-label="PalTable home">
      <img src="assets/logo_transparent.png" alt="PalTable">
    </a>
  </section>
</body>
</html>
